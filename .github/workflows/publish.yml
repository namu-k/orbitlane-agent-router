name: Publish package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the OIDC identity token npm exchanges for publish rights.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # No registry-url on purpose. It makes setup-node write an .npmrc line reading
      # _authToken=${NODE_AUTH_TOKEN}; npm then treats authentication as already
      # configured and never starts the OIDC exchange, failing with ENEEDAUTH or E404.
      # NODE_AUTH_TOKEN stays unset for the same reason: trusted publishing uses no
      # token at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node 22 ships npm 10; trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run --json
      # Records whether the runner was actually granted an OIDC identity, which tells
      # a failed publish apart: no identity means the permission never took effect,
      # an identity plus a rejection means the trusted publisher does not match.
      - name: Report OIDC identity availability
        run: |
          # Presence only. Never interpolate the values: the request token is a
          # credential and the request URL identifies the run.
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then echo "request URL: present"; else echo "request URL: absent"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" ]; then echo "request token: present"; else echo "request token: absent"; fi
      # Publish rights come from the trusted publisher registered on npmjs.com against
      # this repository and this workflow filename. There is no NPM_TOKEN secret.
      - run: npm publish --access public --loglevel verbose
